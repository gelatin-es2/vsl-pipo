<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="referrer" content="origin" />
<title>VSL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .player {
    position: relative;
    width: 100%; height: 100vh;
    background: #000;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  video {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    background: #000;
  }

  /* overlay tap-to-unmute */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.45);
    color: #fff; text-align: center;
    z-index: 10;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .overlay-btn {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    border: 3px solid #fff;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
    animation: pulseRing 1.6s ease-out infinite;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .overlay-icon {
    width: 42px; height: 42px;
    fill: #fff;
  }
  .overlay-text {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    animation: blinkText 1.6s ease-in-out infinite;
    padding: 0 16px;
  }
  .overlay-sub {
    font-size: 13px;
    font-weight: 500;
    margin-top: 6px;
    opacity: 0.85;
    text-transform: none;
    letter-spacing: 0.2px;
  }
  @keyframes pulseRing {
    0%   { box-shadow: 0 0 0 0   rgba(255,255,255,0.55); transform: scale(1); }
    70%  { box-shadow: 0 0 0 28px rgba(255,255,255,0);    transform: scale(1.04); }
    100% { box-shadow: 0 0 0 0   rgba(255,255,255,0);    transform: scale(1); }
  }
  @keyframes blinkText {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }

  /* fake progress bar (VTurb style — fast then slow) */
  .progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 4px;
    background: rgba(255, 255, 255, 0.18);
    z-index: 5;
    pointer-events: none;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: #ff2d2d;
    box-shadow: 0 0 8px rgba(255, 45, 45, 0.55);
    transition: width 0.25s linear;
  }

  /* loading spinner */
  .loader {
    position: absolute; top: 50%; left: 50%;
    width: 44px; height: 44px;
    margin: -22px 0 0 -22px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    z-index: 8;
  }
  .loader.hidden { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="player" id="player">
    <video id="video" muted playsinline autoplay preload="auto" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback"></video>

    <div class="loader hidden" id="loader"></div>

    <div class="overlay" id="overlay">
      <div class="overlay-btn">
        <svg class="overlay-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>
        </svg>
      </div>
      <div class="overlay-text">Haz clic para escuchar</div>
      <div class="overlay-sub">Tu video ya comenzó</div>
    </div>

    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

<script>
(function () {
  const params  = new URLSearchParams(window.location.search);
  const raw     = params.get('v') || 'vsl_001';
  const vid     = raw.replace(/[^a-zA-Z0-9_-]/g, '');

  const video    = document.getElementById('video');
  const overlay  = document.getElementById('overlay');
  const player   = document.getElementById('player');
  const progress = document.getElementById('progressBar');
  const loader   = document.getElementById('loader');

  video.src = 'videos/' + vid + '.mp4';
  video.load();

  const tryPlay = () => video.play().catch(() => {});
  tryPlay();

  // tap-to-unmute on entire player area
  let unmuted = false;
  function unmute() {
    if (unmuted) return;
    unmuted = true;
    video.muted = false;
    video.volume = 1;
    overlay.classList.add('hidden');
    tryPlay();
  }
  player.addEventListener('click', unmute);
  player.addEventListener('touchstart', unmute, { passive: true });

  // loading indicator
  video.addEventListener('waiting',  () => loader.classList.remove('hidden'));
  video.addEventListener('playing',  () => loader.classList.add('hidden'));
  video.addEventListener('canplay',  () => loader.classList.add('hidden'));

  // VTurb-style fake progress bar — fast start, slow tail
  // segments map elapsed % of REAL duration -> displayed % on the bar
  function fakeMap(realPct) {
    if (realPct <= 0)  return 0;
    if (realPct >= 1)  return 100;
    if (realPct < 0.10) return (realPct / 0.10) * 38;          //  0..10%  ->  0..38%
    if (realPct < 0.30) return 38 + ((realPct - 0.10) / 0.20) * 24; // 10..30% -> 38..62%
    if (realPct < 0.70) return 62 + ((realPct - 0.30) / 0.40) * 26; // 30..70% -> 62..88%
    return 88 + ((realPct - 0.70) / 0.30) * 12;                // 70..100% -> 88..100%
  }

  function tick() {
    const d = video.duration;
    if (!d || isNaN(d) || d <= 0) return;
    const pct = Math.min(1, video.currentTime / d);
    progress.style.width = fakeMap(pct).toFixed(2) + '%';
  }
  setInterval(tick, 250);

  // hide native controls / disable context menu
  video.controls = false;
  video.addEventListener('contextmenu', e => e.preventDefault());

  // keep playing on visibility regain (mobile tab switch)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) tryPlay();
  });
})();
</script>
</body>
</html>
